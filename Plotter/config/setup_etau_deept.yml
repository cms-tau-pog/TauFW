##
## Config file for default TES fit in mutau channel
## contact: saskia.falke@cern.ch
##

# NOTE: In general, the main information (channel, baselineCuts, etc.) should be given.
#       More specific sub-options (like weight replacement for systematic uncertainties) are optional
#       These are not needed for plotting only


channel: etau_deept

baselineCuts: "q_1*q_2<0 && iso_1<0.10 && mvaFall17noIso_WP90_1 && idDeepTau2018v2p5VSjet_2>=5 && idDeepTau2018v2p5VSmu_2>=4 && !lepton_vetoes_notau && metfilter && idDeepTau2018v2p5VSe_2>=2"
regions:
   signalRegion: 
      definition: "mt_1<40"
      title: "signal region"
   DM0: 
      definition: "mt_1<40 && dm_2==0"
      title: "h^{#pm}"
   DM1: 
      definition: "mt_1<40 && dm_2==1"
      title: "h^{#pm}#pi^{0}"
   DM10: 
      definition: "mt_1<40 && dm_2==10"
      title: "h^{#pm}h^{#mp}h^{#pm}"
   VSeVLoose:
      definition: "mt_1<40 && idDeepTau2018v2p5VSe_2>=3"
      title: "DeepTauVSe: VL"
   VSeLoose:
      definition: "mt_1<40 && idDeepTau2018v2p5VSe_2>=4"
      title: "DeepTauVSe: L"
   VSeMed:
      definition: "mt_1<40 && idDeepTau2018v2p5VSe_2>=5"
      title: "DeepTauVSe: M"
   VSeTight:
      definition: "mt_1<40 && idDeepTau2018v2p5VSe_2>=6"
      title: "DeepTauVSe: T"
   VSeVTight:
      definition: "mt_1<40 && idDeepTau2018v2p5VSe_2>=7"
      title: "DeepTauVSe: VT"
   VSeVVTight:
      definition: "mt_1<40 && idDeepTau2018v2p5VSe_2>=8"
      title: "DeepTauVSe: VVT"
   DM11: 
      definition: "mt_1<40 && dm_2==11"
      title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}"
   PNetDM0: 
      definition: "mt_1<40 && decayModePNet_2==0"
      title: "PNetDM 0"
   PNetDM1: 
      definition: "mt_1<40 && decayModePNet_2==1"
      title: "PNetDM 1"
   PNetDM10: 
      definition: "mt_1<40 && decayModePNet_2==10"
      title: "PNetDM 10"
   PNetDM11: 
      definition: "mt_1<40 && decayModePNet_2==11"
      title: "PNetDM 11" #"pnetdms h^{#pm}h^{#mp}h^{#pm}#pi^{0}"
   PNetNoDM2:
      definition: "mt_1<40 && decayModePNet_2!=2"
      title: "pnetdm!=2"

